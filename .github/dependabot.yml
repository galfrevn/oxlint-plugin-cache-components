version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      development:
        dependency-type: development
      production:
        dependency-type: production
  - package-ecosystem: npm
    directory: /conformance/next-app
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: test
      include: scope
    groups:
      nextjs:
        patterns: ["*"]
