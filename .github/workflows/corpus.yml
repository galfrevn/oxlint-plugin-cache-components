name: Corpus

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - src/**
      - scripts/corpus/**
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: corpus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    name: Time the plugin on the corpus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run corpus --limit 60 --max-ratio 2 --quiet
      - if: always()
        run: |
          for results in scripts/corpus/results/*.md; do
            [ -f "$results" ] || continue
            sed '/^## Findings$/,$d' "$results" >> "$GITHUB_STEP_SUMMARY"
          done
