name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  state:
    name: Release state
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.state.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - id: state
        run: |
          pending=$(find .changeset -name '*.md' ! -name README.md | wc -l)
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$pending" -gt 0 ]; then
            echo "::notice::$pending pending changesets. Run pnpm version-packages in a release pull request to publish them."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif npm view "$name@$version" version > /dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish to npm
    needs: state
    if: needs.state.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/oxlint-plugin-cache-components
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Check npm credentials
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name=$(node -p "require('./package.json').name")
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
            npm whoami
          elif ! npm view "$name" version > /dev/null 2>&1; then
            echo "::error::$name is not on npm yet. Trusted publishing only works for an existing package, so the first version needs an NPM_TOKEN secret in the npm environment."
            exit 1
          fi
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51
        env:
          PNPM_CONFIG_PROVENANCE: "true"
        with:
          publish-script: pnpm run release
